<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="src/style.css">
  <title>js minifier</title>
</head>

<body>
  <div id="app">
    <h1>JavaScript Minifier</h1>
    <label for="txtInputCode">Input JavaScript Code:</label>
    <textarea class="code" id="txtInputCode" placeholder="Enter your JavaScript code here..." spellcheck="false"></textarea>
    <div>char count: <span id="inputLength">0</span></div>

    <button id="btnMinify">Minify Code</button>
    <button id="btnEncodeToURI">Encode to URI</button>
    <button id="btnDecodeURI">Decode to URI</button>

    <hr>

    <label for="txtOutputCode">Minified JavaScript Code:</label>
    <textarea class="code" id="txtOutputCode" readonly placeholder="Minified code will appear here..." spellcheck="false"></textarea>
    <div>char count: <span id="outputLength">0</span></div>


    <!-- Include Terser using Skypack -->
    <script type="module">
      import { minify } from 'https://cdn.skypack.dev/terser';

      const doMinify = () => {
        return new Promise((done, fail) => {
          setTimeout(async _ => {
            try {
              const txtInputCode = document.getElementById('txtInputCode');
              const txtOutputCode = document.getElementById('txtOutputCode');
              if (txtInputCode.value.trim() === '') {
                txtOutputCode.value = '';
                txtOutputCode.dispatchEvent(new Event('change', { bubbles: true }));
                done();
                return;
              }
              txtOutputCode.value = 'loading...';
              const result = await minify(txtInputCode.value);
              if (result.code) {
                txtOutputCode.value = result.code;
                txtOutputCode.classList.remove('error');
                txtOutputCode.dispatchEvent(new Event('change', { bubbles: true }));
                done();
              } else {
                throw new Error(`Error: Unable to minify code.`);
              }
            } catch (error) {
              const txtOutputCode = document.getElementById('txtOutputCode');
              txtOutputCode.value = `Error: ${error}`;
              txtOutputCode.classList.add('error');
              txtOutputCode.dispatchEvent(new Event('change', { bubbles: true }));

              fail(error);
            }
          }, 0);
        });
      };
      document.getElementById('btnMinify').addEventListener('click', doMinify);
      document.getElementById('txtInputCode').addEventListener('keyup', async e => {
        if (e.ctrlKey) {
          if (e.code === 'Enter') {
            if (e.isTrusted === false) return;
            await doMinify();
            document.getElementById('txtOutputCode').dispatchEvent(new Event('change', { bubbles: true }));

          }
        }
      });
      // document.getElementById('txtInputCode').addEventListener('paste', doMinify);
      document.getElementById('txtInputCode').addEventListener('input', doMinify);

      document.getElementById('txtOutputCode').addEventListener('focus', e => {
        e.target.select();
      });

      document.getElementById('btnEncodeToURI').addEventListener('click', async function (e) {
        const txtOutputCode = document.getElementById('txtOutputCode');
        const output = txtOutputCode.value.trim();
        if (output === '') {
          await doMinify();
        }
        txtOutputCode.value = encodeURIComponent(output).trim();
        if (txtOutputCode.value.startsWith('javascript:') === false) {
          txtOutputCode.value = 'javascript:' + txtOutputCode.value;
        }
        txtOutputCode.dispatchEvent(new Event('change', { bubbles: true }));
      });
      document.getElementById('btnDecodeURI').addEventListener('click', async function (e) {
        const txtOutputCode = document.getElementById('txtOutputCode');
        const output = txtOutputCode.value.trim();
        if (output === '') {
          await doMinify();
        }
        txtOutputCode.value = decodeURIComponent(output).trim();
        if (txtOutputCode.value.startsWith('javascript:') === true) {
          txtOutputCode.value = txtOutputCode.value.substring(11).trim();
        }
        txtOutputCode.dispatchEvent(new Event('change', { bubbles: true }));
      });

      document.getElementById('txtInputCode').addEventListener('input', function (e) {
        document.getElementById('inputLength').textContent = e.target.value.length;
      });
      document.getElementById('txtOutputCode').addEventListener('change', function (e) {
        document.getElementById('outputLength').textContent = e.target.value.length;
      });
    </script>
  </div>
</body>

</html>
